# Local demonstration only. Data is retained between restarts.
spring.datasource.url=jdbc:h2:file:./data/spring-admin-demo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
app.bootstrap.enabled=true
app.bootstrap.username=${APP_ADMIN_USERNAME:admin}
app.bootstrap.password=${APP_ADMIN_PASSWORD:Admin@123}
