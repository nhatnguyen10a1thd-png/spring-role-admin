spring.application.name=spring_admin
spring.profiles.default=demo

server.port=8090

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.mvc.static-path-pattern=/static/**

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# SiteMesh 3 integration for Spring Boot 4 / Tomcat 11.
sitemesh.integration=view-resolver
sitemesh.decorator.prefix=/WEB-INF/decorators/
sitemesh.decorator.mappings[0].path=/admin
sitemesh.decorator.mappings[0].decorator=admin.jsp
sitemesh.decorator.mappings[1].path=/admin/*
sitemesh.decorator.mappings[1].decorator=admin.jsp

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.username=${APP_ADMIN_USERNAME:admin}
app.bootstrap.password=${APP_ADMIN_PASSWORD:}
app.bootstrap.email=${APP_ADMIN_EMAIL:admin@example.com}
